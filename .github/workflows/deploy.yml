
name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
      - name: Inspect build output
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type d \( -name dist -o -name build -o -name .output \) -not -path './node_modules/*'
        
      - name: Inspect build output
        run: |
          echo "Root files:"
          ls -la
          echo "Build directories:"
          find . -maxdepth 3 -type d \( -name dist -o -name build -o -name .output \) -not -path './node_modules/*'
      - name: Inspect build output
        run: |
          echo "Workspace:"
          pwd
          echo "Root files:"
          ls -la
          echo "Build output directories:"
          find . -maxdepth 3 -type d \( -name dist -o -name build -o -name .output \) -not -path './node_modules/*'


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
